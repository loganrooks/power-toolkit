name: review-gate

# Enforces the part of review hygiene GitHub cannot express natively:
# every reviewer thread must be REPLIED TO and REACTED TO, not merely resolved.
# (Thread *resolution* is enforced by the repo ruleset — see docs/review-gates.md.)
#
# The verdict is published as a COMMIT STATUS named `review-gate` on the PR head SHA,
# which is what the ruleset requires. The workflow job itself always exits 0 on a clean
# evaluation so there is exactly ONE red thing to look at when the gate is unmet.
#
# Trigger choice is load-bearing: `pull_request_target`, `pull_request_review`,
# `pull_request_review_comment` and `issue_comment` ALL resolve the workflow file from the
# DEFAULT branch. That is why this gate works on stacked PRs whose base branch predates it,
# and why plain `pull_request` is deliberately not used. Nothing from the head branch is
# ever checked out or executed here — this job reads PR metadata and writes a status.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to re-evaluate
        required: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  gate:
    # Skip comments on plain issues; they have no head SHA to post a status to.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate reviewer threads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          repo = os.environ["REPO"]
          owner, name = repo.split("/")
          pr = int(os.environ["PR"])
          run_url = os.environ["RUN_URL"]

          QUERY = """
          query($owner:String!,$name:String!,$num:Int!){
            repository(owner:$owner,name:$name){
              pullRequest(number:$num){
                headRefOid
                author{login}
                reviewThreads(first:100){
                  pageInfo{hasNextPage}
                  nodes{
                    isResolved
                    comments(first:100){
                      nodes{
                        url path line
                        author{login}
                        reactionGroups{content reactors{totalCount}}
                      }
                    }
                  }
                }
                reviews(first:100){
                  pageInfo{hasNextPage}
                  nodes{ url state body author{login} reactionGroups{content reactors{totalCount}} }
                }
                comments(first:100){
                  pageInfo{hasNextPage}
                  nodes{ url author{login} reactionGroups{content reactors{totalCount}} }
                }
              }
            }
          }
          """

          proc = subprocess.run(
              ["gh", "api", "graphql", "-f", "query=" + QUERY,
               "-f", "owner=" + owner, "-f", "name=" + name, "-F", "num=%d" % pr],
              capture_output=True, text=True)
          if proc.returncode != 0:
              sys.stderr.write(proc.stderr)
              sys.exit("review-gate: GraphQL query failed; refusing to publish a verdict")

          data = json.loads(proc.stdout)["data"]["repository"]["pullRequest"]
          sha = data["headRefOid"]
          pr_author = (data["author"] or {}).get("login")

          def reactions(node):
              return sum(g["reactors"]["totalCount"] for g in (node.get("reactionGroups") or []))

          def login(node):
              return ((node or {}).get("author") or {}).get("login")

          unmet = []

          # Truncation guard: an unseen thread must never read as a satisfied one.
          for field in ("reviewThreads", "reviews", "comments"):
              if data[field]["pageInfo"]["hasNextPage"]:
                  unmet.append(
                      "%s exceeds the 100-item query window — the gate cannot see everything on "
                      "this PR. Split it, or paginate this workflow." % field)

          # 1. Inline review threads: reply + reaction + resolution.
          for thread in data["reviewThreads"]["nodes"]:
              comments = thread["comments"]["nodes"]
              if not comments:
                  continue
              head = comments[0]
              reviewer = login(head)
              if reviewer is None or reviewer == pr_author:
                  continue
              where = "%s:%s" % (head.get("path") or "?", head.get("line") or "?")
              tag = "thread %s by @%s" % (where, reviewer)
              if not any(login(c) == pr_author for c in comments[1:]):
                  unmet.append("%s — no reply from @%s: %s" % (tag, pr_author, head["url"]))
              if reactions(head) == 0:
                  unmet.append("%s — no reaction on the finding: %s" % (tag, head["url"]))
              if not thread["isResolved"]:
                  unmet.append("%s — unresolved: %s" % (tag, head["url"]))

          # 2. Review summaries with a body (Codex/CR post their overview here).
          for review in data["reviews"]["nodes"]:
              reviewer = login(review)
              if reviewer is None or reviewer == pr_author:
                  continue
              if review["state"] == "PENDING" or not (review["body"] or "").strip():
                  continue
              if reactions(review) == 0:
                  unmet.append("review summary by @%s — no reaction: %s" % (reviewer, review["url"]))

          # 3. Top-level PR comments from anyone other than the author.
          for comment in data["comments"]["nodes"]:
              reviewer = login(comment)
              if reviewer is None or reviewer == pr_author:
                  continue
              if reactions(comment) == 0:
                  unmet.append("comment by @%s — no reaction: %s" % (reviewer, comment["url"]))

          state = "failure" if unmet else "success"
          if unmet:
              description = "%d reviewer thread(s) not replied to / reacted to / resolved" % len(unmet)
          else:
              description = "every reviewer thread replied to, reacted to, and resolved"

          summary = ["# review-gate — `%s`" % state, "", "PR #%d @ `%s`" % (pr, sha[:7]), ""]
          if unmet:
              summary.append("Unmet obligations:")
              summary.append("")
              summary.extend("- %s" % u for u in unmet)
              summary += ["", "A verdict block belongs on every reply — see `docs/review-gates.md`."]
          else:
              summary.append("No outstanding reviewer obligations.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(summary) + "\n")

          subprocess.run(
              ["gh", "api", "repos/%s/statuses/%s" % (repo, sha),
               "-f", "state=" + state,
               "-f", "context=review-gate",
               "-f", "description=" + description[:139],
               "-f", "target_url=" + run_url],
              check=True)

          print("review-gate: %s (%d unmet)" % (state, len(unmet)))
          PY
