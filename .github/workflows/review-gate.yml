name: review-gate

# Enforces the part of review hygiene GitHub cannot express natively:
# every reviewer thread must be REPLIED TO and REACTED TO, not merely resolved.
# (Thread *resolution* is enforced by the repo ruleset — see docs/review-gates.md.)
#
# The verdict is published as a COMMIT STATUS named `review-gate` on the PR head SHA,
# which is what the ruleset requires. The workflow job itself always exits 0 on a clean
# evaluation so there is exactly ONE red thing to look at when the gate is unmet.
#
# TRIGGER SEMANTICS — measured on this repo 2026-07-26, not assumed:
#   `pull_request_review` and `pull_request_review_comment` fire ONLY when the pull request's
#   base branch is the repository's DEFAULT branch. On PR #2 (base `feat/mem-watchdog-m0-observe`)
#   a Codex review and two human replies produced no run at all; the identical event types on
#   PR #1 (base `main`) fired immediately. Isolated by changing only the base branch.
#
#   That is why `schedule` below is load-bearing rather than belt-and-braces. Without it a
#   STACKED pull request keeps whatever status it was given at open time — which is `success`,
#   vacuously, because no reviewer had commented yet — and a stale-green REQUIRED check means
#   the PR is mergeable with unanswered findings. The gate would fail OPEN, the one direction
#   a gate must never fail.
#
#   All triggers here resolve the workflow file from the DEFAULT branch, so the gate also
#   covers PRs whose base branch predates it. Plain `pull_request` would resolve from the head
#   branch and silently not run at all.
#
# Nothing from the head branch is ever checked out or executed: this job reads PR metadata
# and writes a commit status.
#
# THE INVARIANT — read this before editing anything below.
#   A required status that is not freshly written KEEPS ITS PREVIOUS VALUE, and the previous
#   value is `success` in every case that matters, because a PR is green at open time before
#   any reviewer has commented. So EVERY way this workflow can fail quietly is a fail-OPEN:
#   the PR becomes mergeable with unanswered findings. Codex round 1 on PR #3 found four
#   independent instances of that one shape — an ignored status-publish failure, an
#   unpaginated PR listing, commit-status quota exhaustion, and the 100-item GraphQL window.
#
#   Therefore: any condition that prevents us from establishing OR publishing a verdict must
#   make the run LOUD — a `failure` status where we have a SHA to write to, a non-zero exit
#   otherwise. Never `pass`, never a bare `except`, never a partial sweep reported as success.
#   Residual risk that is NOT closed: if the statuses API itself is unavailable we cannot turn
#   a green SHA red at all. The run fails visibly and the next sweep retries, so the exposure
#   is bounded by API availability, but it is real and is not engineered away.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    # Bounds staleness for stacked PRs at ~10 min. GitHub disables scheduled workflows after
    # 60 days without repository activity; if that happens the gate stops re-evaluating
    # stacked PRs and they hold their last verdict.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to re-evaluate (blank = every open PR)
        required: false

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || 'sweep' }}
  cancel-in-progress: false

jobs:
  gate:
    # Skip comments on plain issues; they have no head SHA to post a status to.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate reviewer threads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          repo = os.environ["REPO"]
          owner, name = repo.split("/")
          run_url = os.environ["RUN_URL"]

          QUERY = """
          query($owner:String!,$name:String!,$num:Int!){
            repository(owner:$owner,name:$name){
              pullRequest(number:$num){
                headRefOid
                updatedAt
                author{login}
                reviewThreads(first:100){
                  pageInfo{hasNextPage}
                  nodes{
                    isResolved
                    comments(first:100){
                      nodes{
                        url path line
                        author{login}
                        reactionGroups{content reactors{totalCount}}
                      }
                    }
                  }
                }
                reviews(first:100){
                  pageInfo{hasNextPage}
                  nodes{ url state body author{login} reactionGroups{content reactors{totalCount}} }
                }
                comments(first:100){
                  pageInfo{hasNextPage}
                  nodes{ url author{login} reactionGroups{content reactors{totalCount}} }
                }
              }
            }
          }
          """

          def gh(args):
              proc = subprocess.run(["gh"] + args, capture_output=True, text=True)
              if proc.returncode != 0:
                  sys.stderr.write(proc.stderr)
                  return None
              return proc.stdout

          def reactions(node):
              return sum(g["reactors"]["totalCount"] for g in (node.get("reactionGroups") or []))

          def login(node):
              return ((node or {}).get("author") or {}).get("login")

          def publish(sha, state, description):
              """Write the verdict, unless an identical one is already the current status.

              The dedupe is not an optimisation. GitHub caps commit statuses at 1000 per SHA
              per context; a */10 sweep republishing an unchanged verdict burns 144/day and
              exhausts that in under seven days, after which a SHA that is currently GREEN can
              never be turned red — the exact fail-open this workflow exists to prevent.
              The combined-status endpoint returns only the latest status per context, so
              comparing against it is sound.
              """
              current = gh(["api", "repos/%s/commits/%s/status" % (repo, sha),
                            "--jq", '[.statuses[] | select(.context=="review-gate")][0].state // ""'])
              if current is not None and current.strip() == state:
                  return True
              return gh(["api", "repos/%s/statuses/%s" % (repo, sha),
                         "-f", "state=" + state,
                         "-f", "context=review-gate",
                         "-f", "description=" + description[:139],
                         "-f", "target_url=" + run_url]) is not None

          def strictly_newer(before, after):
              """True only when `after` can be POSITIVELY established as later than `before`.

              Used to decide whether a sweep's snapshot has been overtaken. Any doubt — a parse
              failure, a missing value, a format surprise — returns False, which means we
              publish. Defaulting the other way would skip the write and leave a stale status,
              and stale means green. The safe default here is to write, not to abstain.
              """
              try:
                  from datetime import datetime
                  fmt = "%Y-%m-%dT%H:%M:%SZ"
                  return datetime.strptime(after.strip(), fmt) > datetime.strptime(before.strip(), fmt)
              except Exception:
                  return False

          def evaluate(pr, sweep=False):
              out = gh(["api", "graphql", "-f", "query=" + QUERY,
                        "-f", "owner=" + owner, "-f", "name=" + name, "-F", "num=%d" % pr])
              if out is None:
                  sys.stderr.write("review-gate: GraphQL failed for PR %d; no verdict published\n" % pr)
                  return None

              data = json.loads(out)["data"]["repository"]["pullRequest"]
              sha = data["headRefOid"]
              snapshot_at = data["updatedAt"]
              pr_author = (data["author"] or {}).get("login")
              unmet = []

              # Truncation guard: an unseen thread must never read as a satisfied one.
              for field in ("reviewThreads", "reviews", "comments"):
                  if data[field]["pageInfo"]["hasNextPage"]:
                      unmet.append(
                          "%s exceeds the 100-item query window — the gate cannot see everything "
                          "on this PR. Split it, or paginate this workflow." % field)

              # 1. Inline review threads: reply + reaction + resolution.
              for thread in data["reviewThreads"]["nodes"]:
                  comments = thread["comments"]["nodes"]
                  if not comments:
                      continue
                  head = comments[0]
                  reviewer = login(head)
                  if reviewer is None or reviewer == pr_author:
                      continue
                  where = "%s:%s" % (head.get("path") or "?", head.get("line") or "?")
                  tag = "thread %s by @%s" % (where, reviewer)
                  if not any(login(c) == pr_author for c in comments[1:]):
                      unmet.append("%s — no reply from @%s: %s" % (tag, pr_author, head["url"]))
                  if reactions(head) == 0:
                      unmet.append("%s — no reaction on the finding: %s" % (tag, head["url"]))
                  if not thread["isResolved"]:
                      unmet.append("%s — unresolved: %s" % (tag, head["url"]))

              # 2. Review summaries with a body (Codex/CR post their overview here).
              for review in data["reviews"]["nodes"]:
                  reviewer = login(review)
                  if reviewer is None or reviewer == pr_author:
                      continue
                  if review["state"] == "PENDING" or not (review["body"] or "").strip():
                      continue
                  if reactions(review) == 0:
                      unmet.append("review summary by @%s — no reaction: %s" % (reviewer, review["url"]))

              # 3. Top-level PR comments from anyone other than the author.
              for comment in data["comments"]["nodes"]:
                  reviewer = login(comment)
                  if reviewer is None or reviewer == pr_author:
                      continue
                  if reactions(comment) == 0:
                      unmet.append("comment by @%s — no reaction: %s" % (reviewer, comment["url"]))

              state = "failure" if unmet else "success"
              description = ("%d reviewer thread(s) not replied to / reacted to / resolved" % len(unmet)
                             if unmet else
                             "every reviewer thread replied to, reacted to, and resolved")

              # A sweep evaluates from a snapshot and runs in its own concurrency group, so an
              # event-triggered run can publish a NEWER verdict while this one is still working.
              # Writing our older result over it would put the gate back to stale-green. Only
              # skip when the PR can be POSITIVELY shown to have moved; see strictly_newer.
              if sweep:
                  latest = gh(["api", "repos/%s/pulls/%d" % (repo, pr), "--jq", ".updated_at"])
                  if latest is not None and strictly_newer(snapshot_at, latest):
                      sys.stderr.write(
                          "review-gate: PR %d moved during the sweep; deferring to the newer run\n" % pr)
                      return (pr, sha, "deferred", [])

              if not publish(sha, state, description):
                  sys.stderr.write("review-gate: could not publish status for PR %d\n" % pr)
                  return None

              return (pr, sha, state, unmet)

          raw = (os.environ.get("PR") or "").strip()
          sweep = not raw
          skipped = []

          if raw:
              targets = [int(raw)]
          else:
              # --paginate, because an unpaginated first page silently drops PRs 101+ and the
              # count guard below cannot detect an omission it never knew about. A stacked PR
              # off the end of page 1 would keep its stale green forever.
              default_branch = (gh(["api", "repos/" + repo, "--jq", ".default_branch"]) or "").strip()
              listing = gh(["api", "--paginate", "repos/%s/pulls?state=open&per_page=100" % repo,
                            "--jq", r'.[] | "\(.number) \(.base.ref)"'])
              if listing is None or not default_branch:
                  sys.exit("review-gate: could not list open PRs")
              rows = [ln.split() for ln in listing.splitlines() if ln.strip()]

              # Stacked PRs first. Their review events never fire (see TRIGGER SEMANTICS above),
              # so this sweep is their ONLY source of a fresh verdict; a PR based on the default
              # branch that loses its slot still has event coverage.
              rows.sort(key=lambda r: r[1] == default_branch)
              targets = [int(r[0]) for r in rows]

              # GITHUB_TOKEN allows ~1000 GraphQL points per repo per hour and this sweep runs 6
              # times an hour, so past ~150 open PRs the tail would start hitting rate limits and
              # silently retain stale statuses. Truncate deliberately and LOUDLY instead: no
              # silent caps, because a cap nobody reports reads as full coverage.
              BUDGET = 150
              if len(targets) > BUDGET:
                  skipped = targets[BUDGET:]
                  targets = targets[:BUDGET]

          results = [r for r in (evaluate(p, sweep) for p in targets) if r is not None]

          lines = ["# review-gate", ""]
          if skipped:
              lines += ["> **%d PR(s) were NOT evaluated** — the sweep budget of %d was exceeded, so"
                        " these retain whatever status they last had: %s"
                        % (len(skipped), BUDGET, ", ".join("#%d" % p for p in skipped)),
                        "", "Lower the cron frequency or raise the budget.", ""]
          for pr, sha, state, unmet in results:
              lines.append("## PR #%d @ `%s` — **%s**" % (pr, sha[:7], state))
              lines.append("")
              if state == "deferred":
                  lines.append("Moved during the sweep; a newer run owns the verdict.")
                  lines.append("")
                  continue
              if unmet:
                  lines.extend("- %s" % u for u in unmet)
                  lines.append("")
                  lines.append("A verdict block belongs on every reply — see `docs/review-gates.md`.")
              else:
                  lines.append("No outstanding reviewer obligations.")
              lines.append("")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")

          for pr, _, state, unmet in results:
              print("review-gate: PR #%d %s (%d unmet)" % (pr, state, len(unmet)))

          # A PR we could not evaluate has NO fresh status, so it silently keeps its previous
          # one. Fail the run loudly rather than let a sweep report success over a gap.
          if len(results) != len(targets):
              sys.exit("review-gate: %d of %d PR evaluations failed; their statuses are STALE"
                       % (len(targets) - len(results), len(targets)))
          if skipped:
              sys.exit("review-gate: sweep budget %d exceeded; %d PR(s) not evaluated and their "
                       "statuses are STALE: %s"
                       % (BUDGET, len(skipped), ", ".join("#%d" % p for p in skipped)))
          PY
