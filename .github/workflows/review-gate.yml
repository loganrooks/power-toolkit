name: review-gate

# Enforces the part of review hygiene GitHub cannot express natively:
# every reviewer thread must be REPLIED TO and REACTED TO, not merely resolved.
# (Thread *resolution* is enforced by the repo ruleset — see docs/review-gates.md.)
#
# The verdict is published as a COMMIT STATUS named `review-gate` on the PR head SHA,
# which is what the ruleset requires. The workflow job itself always exits 0 on a clean
# evaluation so there is exactly ONE red thing to look at when the gate is unmet.
#
# TRIGGER SEMANTICS — measured on this repo 2026-07-26, not assumed:
#   `pull_request_review` and `pull_request_review_comment` fire ONLY when the pull request's
#   base branch is the repository's DEFAULT branch. On PR #2 (base `feat/mem-watchdog-m0-observe`)
#   a Codex review and two human replies produced no run at all; the identical event types on
#   PR #1 (base `main`) fired immediately. Isolated by changing only the base branch.
#
#   That is why `schedule` below is load-bearing rather than belt-and-braces. Without it a
#   STACKED pull request keeps whatever status it was given at open time — which is `success`,
#   vacuously, because no reviewer had commented yet — and a stale-green REQUIRED check means
#   the PR is mergeable with unanswered findings. The gate would fail OPEN, the one direction
#   a gate must never fail.
#
#   All triggers here resolve the workflow file from the DEFAULT branch, so the gate also
#   covers PRs whose base branch predates it. Plain `pull_request` would resolve from the head
#   branch and silently not run at all.
#
# Nothing from the head branch is ever checked out or executed: this job reads PR metadata
# and writes a commit status.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    # Bounds staleness for stacked PRs at ~10 min. GitHub disables scheduled workflows after
    # 60 days without repository activity; if that happens the gate stops re-evaluating
    # stacked PRs and they hold their last verdict.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to re-evaluate (blank = every open PR)
        required: false

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || 'sweep' }}
  cancel-in-progress: false

jobs:
  gate:
    # Skip comments on plain issues; they have no head SHA to post a status to.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate reviewer threads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          repo = os.environ["REPO"]
          owner, name = repo.split("/")
          run_url = os.environ["RUN_URL"]

          QUERY = """
          query($owner:String!,$name:String!,$num:Int!){
            repository(owner:$owner,name:$name){
              pullRequest(number:$num){
                headRefOid
                author{login}
                reviewThreads(first:100){
                  pageInfo{hasNextPage}
                  nodes{
                    isResolved
                    comments(first:100){
                      nodes{
                        url path line
                        author{login}
                        reactionGroups{content reactors{totalCount}}
                      }
                    }
                  }
                }
                reviews(first:100){
                  pageInfo{hasNextPage}
                  nodes{ url state body author{login} reactionGroups{content reactors{totalCount}} }
                }
                comments(first:100){
                  pageInfo{hasNextPage}
                  nodes{ url author{login} reactionGroups{content reactors{totalCount}} }
                }
              }
            }
          }
          """

          def gh(args):
              proc = subprocess.run(["gh"] + args, capture_output=True, text=True)
              if proc.returncode != 0:
                  sys.stderr.write(proc.stderr)
                  return None
              return proc.stdout

          def reactions(node):
              return sum(g["reactors"]["totalCount"] for g in (node.get("reactionGroups") or []))

          def login(node):
              return ((node or {}).get("author") or {}).get("login")

          def evaluate(pr):
              out = gh(["api", "graphql", "-f", "query=" + QUERY,
                        "-f", "owner=" + owner, "-f", "name=" + name, "-F", "num=%d" % pr])
              if out is None:
                  sys.stderr.write("review-gate: GraphQL failed for PR %d; no verdict published\n" % pr)
                  return None

              data = json.loads(out)["data"]["repository"]["pullRequest"]
              sha = data["headRefOid"]
              pr_author = (data["author"] or {}).get("login")
              unmet = []

              # Truncation guard: an unseen thread must never read as a satisfied one.
              for field in ("reviewThreads", "reviews", "comments"):
                  if data[field]["pageInfo"]["hasNextPage"]:
                      unmet.append(
                          "%s exceeds the 100-item query window — the gate cannot see everything "
                          "on this PR. Split it, or paginate this workflow." % field)

              # 1. Inline review threads: reply + reaction + resolution.
              for thread in data["reviewThreads"]["nodes"]:
                  comments = thread["comments"]["nodes"]
                  if not comments:
                      continue
                  head = comments[0]
                  reviewer = login(head)
                  if reviewer is None or reviewer == pr_author:
                      continue
                  where = "%s:%s" % (head.get("path") or "?", head.get("line") or "?")
                  tag = "thread %s by @%s" % (where, reviewer)
                  if not any(login(c) == pr_author for c in comments[1:]):
                      unmet.append("%s — no reply from @%s: %s" % (tag, pr_author, head["url"]))
                  if reactions(head) == 0:
                      unmet.append("%s — no reaction on the finding: %s" % (tag, head["url"]))
                  if not thread["isResolved"]:
                      unmet.append("%s — unresolved: %s" % (tag, head["url"]))

              # 2. Review summaries with a body (Codex/CR post their overview here).
              for review in data["reviews"]["nodes"]:
                  reviewer = login(review)
                  if reviewer is None or reviewer == pr_author:
                      continue
                  if review["state"] == "PENDING" or not (review["body"] or "").strip():
                      continue
                  if reactions(review) == 0:
                      unmet.append("review summary by @%s — no reaction: %s" % (reviewer, review["url"]))

              # 3. Top-level PR comments from anyone other than the author.
              for comment in data["comments"]["nodes"]:
                  reviewer = login(comment)
                  if reviewer is None or reviewer == pr_author:
                      continue
                  if reactions(comment) == 0:
                      unmet.append("comment by @%s — no reaction: %s" % (reviewer, comment["url"]))

              state = "failure" if unmet else "success"
              description = ("%d reviewer thread(s) not replied to / reacted to / resolved" % len(unmet)
                             if unmet else
                             "every reviewer thread replied to, reacted to, and resolved")

              gh(["api", "repos/%s/statuses/%s" % (repo, sha),
                  "-f", "state=" + state,
                  "-f", "context=review-gate",
                  "-f", "description=" + description[:139],
                  "-f", "target_url=" + run_url])

              return (pr, sha, state, unmet)

          raw = (os.environ.get("PR") or "").strip()
          if raw:
              targets = [int(raw)]
          else:
              listing = gh(["api", "repos/%s/pulls?state=open&per_page=100" % repo,
                            "--jq", "[.[].number]"])
              if listing is None:
                  sys.exit("review-gate: could not list open PRs")
              targets = json.loads(listing)

          results = [r for r in (evaluate(p) for p in targets) if r is not None]

          lines = ["# review-gate", ""]
          for pr, sha, state, unmet in results:
              lines.append("## PR #%d @ `%s` — **%s**" % (pr, sha[:7], state))
              lines.append("")
              if unmet:
                  lines.extend("- %s" % u for u in unmet)
                  lines.append("")
                  lines.append("A verdict block belongs on every reply — see `docs/review-gates.md`.")
              else:
                  lines.append("No outstanding reviewer obligations.")
              lines.append("")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")

          for pr, _, state, unmet in results:
              print("review-gate: PR #%d %s (%d unmet)" % (pr, state, len(unmet)))

          # A PR we could not evaluate has NO fresh status, so it silently keeps its previous
          # one. Fail the run loudly rather than let a sweep report success over a gap.
          if len(results) != len(targets):
              sys.exit("review-gate: %d of %d PR evaluations failed; their statuses are STALE"
                       % (len(targets) - len(results), len(targets)))
          PY
